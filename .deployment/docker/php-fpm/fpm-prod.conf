[www]
; =============================================================================
; FPM конфигурация для PRODUCTION окружения
; =============================================================================

; Слушаем на всех интерфейсах для доступа из nginx контейнера
listen = 0.0.0.0:9000

; Разрешаем подключения из любых IP (для Docker сети)
; listen.allowed_clients =

; Настройки процессов для продакшена (больше воркеров для нагрузки)
pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 1000

; Таймауты для продакшена
request_terminate_timeout = 30s
request_slowlog_timeout = 10s

; Логирование медленных запросов в stderr (для Docker)
slowlog = /proc/self/fd/2

; Логирование доступа в stderr (для Docker)
access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

; Статус страницы для мониторинга
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Безопасность
security.limit_extensions = .php

; Переменные окружения
clear_env = no

; Настройки соединения
listen.backlog = 511
