[www]
; =============================================================================
; FPM конфигурация для DEVELOPMENT окружения
; =============================================================================

; Слушаем на всех интерфейсах для доступа из nginx контейнера
listen = 0.0.0.0:9000

; Разрешаем подключения из любых IP (для Docker сети)
; listen.allowed_clients =

; Настройки процессов для разработки (экономим ресурсы)
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 200

; Таймауты
request_terminate_timeout = 60s

; Безопасность
security.limit_extensions = .php

; Переменные окружения
clear_env = no

; Настройки соединения
listen.backlog = 511
